<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <!-- Brand gold, matching --brand-gold. This was #1a1a2e, a navy from before
         the redesign, so the browser chrome and the PWA splash were the last
         two surfaces still showing the old brand. -->
    <meta name="theme-color" content="#c9a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Ajmal - أجمل | Book a barber in Lebanon</title>
    <meta name="description" content="Book a barber in Lebanon, join a queue, and see the wait before you leave the house." />

    <!--
      Open Graph and Twitter cards.

      There were none at all, so every share of a booking link — and every
      channel this product acquires through is a shared link: the countertop QR
      card, the printed poster, the Instagram bio, the WhatsApp message — showed
      a bare URL with no title, no description and no image.

      These are app-level. Per-shop tags (the shop's own name and cover photo on
      its /book/:slug card) need the crawler to see server-rendered HTML, and
      this is a client-rendered SPA with no SSR or prerender step, so they are
      still outstanding rather than solved here.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ajmal" />
    <meta property="og:title" content="Ajmal — book a barber in Lebanon" />
    <meta property="og:description" content="Book a barber, join a queue, and see the wait before you leave the house." />
    <!-- A PNG, not the SVG favicon: most crawlers that build a link preview
         (Facebook, WhatsApp, LinkedIn) don't render SVG for og:image at all. -->
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_LB" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ajmal — book a barber in Lebanon" />
    <meta name="twitter:description" content="Book a barber, join a queue, and see the wait before you leave the house." />
    <meta name="twitter:image" content="/icon-512.png" />

    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
